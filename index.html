<h1>文字ぼかし（TextBlur） サポート</h1>
<p>画像の中の文字を自動で見つけて、ぼかすMac用アプリです。画像はMacの外に出ません。</p>
<h2>お問い合わせ</h2>
<p>不具合やご要望は、<a href="https://github.com/yamaguchidesign/text-blur-site/issues">こちらのページ</a>から書き込んでください（GitHubのアカウントが必要です）。</p>
<h2>よくある質問</h2>
<p><b>複数画像のまとめ処理が使えません。</b><br>アプリ内課金（買い切り）の機能です。購入済みなら、ファイルメニューの「購入を復元」を試してください。</p>
<p><b>購入の返金はできますか。</b><br>購入と返金は Apple が扱います。<a href="https://reportaproblem.apple.com">reportaproblem.apple.com</a> から申請してください。</p>
